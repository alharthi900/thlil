<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>

  <style>

    body{
      font-family: Arial;
      background:#f5f5f5;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      background:white;
      padding:30px;
      border-radius:10px;
      width:300px;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
    }

    button{
      width:100%;
      padding:10px;
      margin-top:15px;
      cursor:pointer;
    }

  </style>
</head>

<body>

<div class="box">

<h2>تسجيل الدخول</h2>

<input type="email" id="email" placeholder="البريد الإلكتروني">

<input type="password" id="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseUrl = 'ضع رابط المشروع هنا';

const supabaseKey = 'ضع المفتاح هنا';

const supabase = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);

async function login(){

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const { data, error } =
    await supabase.auth.signInWithPassword({

      email,
      password

    });

  if(error){

    alert(error.message);

    return;
  }

  alert("تم تسجيل الدخول بنجاح");

  window.location.href = "index.html";
}

</script>

</body>
</html>
